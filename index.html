*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}

.hero .wrap{display:grid;gap:30px;align-items:center}@media(min-width:850px){.hero .wrap{grid-template-columns:1.25fr .75fr}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px #00000008}

.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;max-width:560px}

.empty{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:8px;background:#fff}
