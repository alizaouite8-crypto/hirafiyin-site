<style>
:root{--navy:#0a2540;--cu:#b87333;--bg:#f4f7fa;--ink:#13263b;--mut:#5b6b7c;--line:#d9e1e9;--ok:#1f7a4d;--no:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}

.lang{display:flex;gap:4px;background:#ffffff22;border-radius:99px;padding:3px}.lang button{border:0;background:transparent;color:#fff;font:700 .85rem Cairo;cursor:pointer;padding:4px 10px;border-radius:99px}.lang button.on{background:#fff;color:var(--navy)}
.brand{font-weight:800;letter-spacing:2px;color:#f0c58f;font-size:.9rem}
.hero{background:linear-gradient(rgba(10,37,64,.8),rgba(10,37,64,.92)),url(images/team.jpeg) center/cover var(--navy);color:#fff;padding:56px 0 64px;border-bottom:6px solid var(--cu)}.lg{border-radius:50%;background:#fff}.bn{font-size:.95rem;line-height:1.4}dialog.big{width:min(94vw,900px);padding:10px}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.gal img,.gal video{width:100%;height:190px;object-fit:cover;display:block;background:#000}.gal img{cursor:zoom-in}.gal figcaption{padding:8px 12px;font-size:.9rem;color:var(--mut)}.pc{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.pc .btn{margin:0}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.25;margin:0 0 12px;font-weight:800;max-width:14ch}
.hero .wrap{display:grid;gap:28px;align-items:center}@media(min-width:800px){.hero .wrap{grid-template-columns:1.2fr 1fr}}.himg{width:min(70%,300px);border-radius:50%;background:#fff;justify-self:center;box-shadow:0 8px 30px #0006}

section{padding:44px 0}h2{font-size:1.6rem;margin:0 0 6px}.sub{color:var(--mut);margin:0 0 22px}

.card img{width:100%;height:160px;object-fit:cover;background:var(--line)}.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:1.1rem}.meta{color:var(--mut);font-size:.9rem}.card .btn{margin-top:auto;align-self:flex-start}
.partners{display:flex;flex-wrap:wrap;gap:14px}.partners a{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 18px;display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600}

form{display:grid;gap:10px}label{display:grid;gap:3px;font-size:.92rem;font-weight:600}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;max-width:560px}
dialog{border:0;border-radius:10px;padding:22px;width:min(92vw,420px)}dialog::backdrop{background:#0a254099}
.empty{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:8px;background:#fff}
footer{background:var(--navy);color:#cfd8e3;padding:26px 0;font-size:.92rem}footer .wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.tabs button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 14px;font:600 .95rem Cairo;cursor:pointer}.tabs .on{background:var(--navy);color:#fff}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.8rem;border-radius:99px;padding:1px 10px;background:var(--line)}.tag.accepted{background:#d6f0e2;color:var(--ok)}.tag.refused{background:#f8dcda;color:var(--no)}
#toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
</style>

<script>

const I18N = {
ar:{home:'الرئيسية',trainings:'التكوينات والأنشطة',products:'المنتجات',partners:'الشركاء',join:'انخرط',contact:'تواصل',admin:'دخول الإدارة',heroTitle:'حرفتك تستحق شبكة تليق بها.',heroSub:'نجمع الحرفيين والموردين في جهة سوس ماسة حول التكوين المستمر والتضامن المهني وفرص عمل أكثر.',joinArtisan:'انضم كحرفي',joinSupplier:'انضم كمورد',seeHirafiyin:'شوف HIRAFIYIN',craftsTitle:'حرف البناء والصيانة في شبكة واحدة',craftsSub:'من السباكة إلى التبريد، نرافق الحرفيين في كل التخصصات الأساسية.',whyTitle:'ما تقدمه الجمعية لأعضائها',hirafiyinTitle:'HIRAFIYIN - المنخرطين',hirafiyinSub:'الحرفيين لي قبلاتهم الجمعية.',seeAll:'شوف كاع HIRAFIYIN',trainingsTitle:'التكوينات القادمة',trainingsSub:'سجّل مكانك مباشرة وسنؤكد لك عبر واتساب.',seeGallery:'شاهد صور وفيديوهات أنشطة الجمعية',howTitle:'ثلاث خطوات للانضمام',joinReq:'طلب الانخراط',productsTitle:'منتجات الموردين',productsSub:'منتجات مراجَعة من الجمعية، تواصل مع المورد مباشرة.',sellBtn:'أنا مورد: أريد نشر منتج',partnersTitle:'شركاؤنا',partnersSub:'شركات ومؤسسات تدعم الجمعية.',contactTitle:'تواصل مع الجمعية',contactSub:'لديك سؤال أو تقترح شراكة؟ فريقنا يرد عليك مباشرة.'},
fr:{home:'Accueil',trainings:'Formations & Activités',products:'Produits',partners:'Partenaires',join:'Adhérer',contact:'Contact',admin:'Admin',heroTitle:'Votre métier mérite un réseau à sa hauteur.',heroSub:'Nous réunissons artisans et fournisseurs de Souss-Massa autour de la formation continue, de la solidarité et de plus d’opportunités.',joinArtisan:'Rejoindre comme artisan',joinSupplier:'Rejoindre comme fournisseur',seeHirafiyin:'Voir HIRAFIYIN',craftsTitle:'Métiers du bâtiment en un seul réseau',craftsSub:'De la plomberie à la climatisation, nous accompagnons les artisans.',whyTitle:'Ce que l’association offre à ses membres',hirafiyinTitle:'HIRAFIYIN - Membres',hirafiyinSub:'Les artisans acceptés par l’association.',seeAll:'Voir tous les HIRAFIYIN',trainingsTitle:'Formations à venir',trainingsSub:'Inscrivez-vous, on confirme sur WhatsApp.',seeGallery:'Voir photos et vidéos de nos activités',howTitle:'3 étapes pour adhérer',joinReq:'Demande d’adhésion',productsTitle:'Produits des fournisseurs',productsSub:'Produits vérifiés, contact direct avec le fournisseur.',sellBtn:'Je suis fournisseur : publier un produit',partnersTitle:'Nos partenaires',partnersSub:'Entreprises qui soutiennent l’association.',contactTitle:'Contactez l’association',contactSub:'Une question ou un partenariat ? On vous répond.'},
en:{home:'Home',trainings:'Trainings & Activities',products:'Products',partners:'Partners',join:'Join',contact:'Contact',admin:'Admin Login',heroTitle:'Your craft deserves a network that fits it.',heroSub:'We bring together artisans and suppliers in Souss-Massa around continuous training, professional solidarity and more work opportunities.',joinArtisan:'Join as artisan',joinSupplier:'Join as supplier',seeHirafiyin:'See HIRAFIYIN',craftsTitle:'Building & maintenance trades in one network',craftsSub:'From plumbing to air conditioning, we support artisans in all key trades.',whyTitle:'What the association offers its members',hirafiyinTitle:'HIRAFIYIN - Members',hirafiyinSub:'Artisans accepted by the association.',seeAll:'See all HIRAFIYIN',trainingsTitle:'Upcoming trainings',trainingsSub:'Book your place, we confirm on WhatsApp.',seeGallery:'See photos & videos of our activities',howTitle:'3 steps to join',joinReq:'Membership request',productsTitle:'Supplier products',productsSub:'Reviewed products, contact supplier directly.',sellBtn:'I am a supplier: publish a product',partnersTitle:'Our partners',partnersSub:'Companies supporting the association.',contactTitle:'Contact the association',contactSub:'A question or a partnership? We answer you directly.'}
};
function applyLang(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.dataset.i18n; if(I18N[LANG][k]) el.textContent=I18N[LANG][k]; });
  localStorage.setItem('hirafiyin_lang', LANG); route();
}
document.addEventListener('click', e=>{ const b=e.target.closest('[data-lang]'); if(b){ LANG=b.dataset.lang; applyLang(); }});
const T = k => I18N[LANG][k] || I18N.ar[k] || k;
const CFG = { url: 'https://oldwrxirxrshwvyqvpxp.supabase.co', key: 'sb_publishable_Uv5HMjCc7ZgI4S7BlyjaFQ__ACuR_DX', phone: '0600213299', email: 'lahcenassoughay@gmail.com' };
const CRAFTS = ['السباكة','الكهرباء','النجارة','البناء','الصباغة','التبريد والتكييف'];
const sb = supabase.createClient(CFG.url, CFG.key);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const waLink = (p, t) => { p = String(p).replace(/\D/g, ''); if (p.startsWith('0')) p = '212' + p.slice(1); return 'https://wa.me/' + p + '?text=' + encodeURIComponent(t || ''); };
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
$('#fw').href = waLink(CFG.phone); $('#fe').href = 'mailto:' + CFG.email; $('#fe').textContent = CFG.email;
const craftOpts = CRAFTS.map(c => `<option>${c}</option>`).join('');
const HONEY = '<input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">';
const personFields = `${HONEY}<label>الاسم الكامل<input name="name" required></label><label>رقم الهاتف (واتساب)<input name="phone" type="tel" required placeholder="06XXXXXXXX" pattern="(\\+?212|0)[5-7][0-9]{8}" title="مثال: 0600000000"></label><label>المدينة<input name="city" required></label>`;
async function trainingsHtml() {
  const today = new Date().toISOString().slice(0, 10);
  const { data, error } = await sb.from('trainings').select('*').gte('date', today).order('date');
  if (error) return `<p class="empty">تعذر تحميل التكوينات.</p>`;
  if (!data.length) return `<p class="empty">لا توجد تكوينات مبرمجة حاليا. تابعونا قريبا.</p>`;
  return `<div class="grid">${data.map(t => `<article class="card">${t.image_url ? `<img src="${esc(safeUrl(t.image_url))}" alt="" loading="lazy">` : ''}<div class="b"><h3>${esc(t.title)}</h3><div class="meta">${esc(t.date)} · ${esc(t.place)}${t.seats ? ' · ' + esc(t.seats) + ' مقعد' : ''}</div><p>${esc(t.description)}</p><button class="btn" data-act="reg" data-id="${esc(t.id)}" data-title="${esc(t.title)}">سجّل في التكوين</button></div></article>`).join('')}</div>`;
}
async function partnersHtml() {
  const { data, error } = await sb.from('partners').select('*').order('created_at');
  if (error || !data.length) return `<p class="empty">سيتم الإعلان عن الشركاء قريبا.</p>`;
  return `<div class="partners">${data.map(p => `<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${p.logo_url ? `<img src="${esc(safeUrl(p.logo_url))}" alt="">` : ''}${esc(p.name)}</a>`).join('')}</div>`;
}
const joinHtml = `<div class="panel"><form id="joinForm"><label>أنا<select name="kind"><option value="artisan">حرفي</option><option value="supplier">مورد / شركة</option></select></label>${personFields}<label>التخصص / المجال<select name="craft">${craftOpts}</select></label><button class="btn">أرسل طلب الانخراط</button></form></div>`;
const contactHtml = `<p><a class="btn" href="${waLink(CFG.phone)}" target="_blank" rel="noopener">واتساب</a> <a class="btn alt" href="tel:${CFG.phone}">اتصال ${CFG.phone}</a> <a class="btn alt" href="mailto:${CFG.email}">${CFG.email}</a></p>`;
const sec = (id, h, s, body) => `<section id="${id}"><div class="wrap"><h2>${h}</h2><p class="sub">${s}</p>${body}</div></section>`;
const WHY=[['تكوين مستمر','دورات تطبيقية تواكب التقنيات والمعايير الجديدة في كل حرفة.'],['تضامن مهني','شبكة دعم بين الأعضاء في الأوقات الصعبة والمشاريع الكبرى.'],['موردون موثوقون','علاقة مباشرة مع موردين معتمدين وبشروط أفضل للأعضاء.'],['فرص عمل','ظهور أكبر أمام الزبائن والمقاولات في الجهة.']];
const HOW=[['املأ الطلب','أرسل معلوماتك المهنية عبر الاستمارة في أقل من دقيقتين.'],['نتواصل معك','يراجع فريق الجمعية طلبك ويتصل بك لتأكيد المعطيات.'],['استفد من الشبكة','تكوينات، تضامن مهني، وعلاقات مباشرة مع الموردين والزبائن.']];
async function hirafiyinHtml(){
  const {data} = await sb.from('members').select('*').eq('status','accepted').order('created_at',{ascending:false});
  if(!data||!data.length) return `<p class="empty">لا يوجد حرفيون مقبولون بعد. أول منخرط مقبول غادي يبان هنا أوتوماتيك.</p>`;
  return `<div class="grid">${data.map(m=>`<article class="card"><div class="b"><h3>HIRAFIYIN · ${esc(m.name)}</h3><div class="meta">${esc(m.craft||'')} · ${esc(m.city||'')} · ${m.kind==='artisan'?'حرفي':'مورد'}</div><span class="tag accepted">عضو مقبول ✅</span><div class="pc"><a class="btn sm ok" target="_blank" rel="noopener" href="${waLink(m.phone,'السلام عليكم، بغيت نخدم معاك')}">واتساب</a><a class="btn sm alt" href="tel:${esc(String(m.phone).replace(/\s/g,''))}">اتصال</a></div></div></article>`).join('')}</div>`;
}
async function pageHirafiyin(){
  app.innerHTML = sec('hirafiyin', T('hirafiyinTitle'), T('hirafiyinSub'), '<div id="hList">...</div><p style="margin-top:18px"><a class="btn" href="#/join">+ '+T('joinReq')+'</a></p>');
  $('#hList').innerHTML = await hirafiyinHtml();
}
async function pageHome() {
  app.innerHTML = `<div class="hero"><div class="wrap"><div><p class="an">جمعية التكوين والتنمية الاجتماعية لرصاصي جهة سوس ماسة · HIRAFIYIN</p><h1>${T('heroTitle')}</h1><p>${T('heroSub')}</p><a class="btn" href="#/join">${T('joinArtisan')}</a> <a class="btn alt" href="#/join">${T('joinSupplier')}</a> <a class="btn alt" href="#/hirafiyin">${T('seeHirafiyin')}</a></div><img class="himg" src="images/logo.jpeg" alt="شعار الجمعية" onerror="this.remove()"></div></div>${sec('c', T('craftsTitle'), T('craftsSub'), `<div class="partners">${CRAFTS.map(c => `<span class="tag" style="font-size:1rem;padding:6px 18px;background:#fff;border:1px solid var(--line)">${c}</span>`).join('')}</div>`)}${sec('w', T('whyTitle'), '', `<div class="grid">${WHY.map(([h, p]) => `<div class="card"><div class="b"><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</div>`)}${sec('hirafiyin-home', T('hirafiyinTitle'), T('hirafiyinSub'), '<div id="hHome">...</div><p style="margin-top:18px"><a class="btn alt" href="#/hirafiyin">'+T('seeAll')+'</a></p>')}${sec('t', T('trainingsTitle'), T('trainingsSub'), '<div id="tr">...</div><p style="margin-top:18px"><a class="btn alt" href="#/trainings">'+T('seeGallery')+'</a></p>')}${sec('h', T('howTitle'), '', `<div class="grid">${HOW.map(([h, p], i) => `<div class="card"><div class="b"><h3>${i + 1}. ${h}</h3><p>${p}</p></div></div>`).join('')}</div><p style="margin-top:18px"><a class="btn" href="#/join">'+T('joinReq')+'</a></p>`)}${sec('m', T('productsTitle'), T('productsSub'), '<div id="pr">...</div><p style="margin-top:18px"><a class="btn alt" href="#/sell">'+T('sellBtn')+'</a></p>')}${sec('p', T('partnersTitle'), T('partnersSub'), '<div id="pa">...</div>')}${sec('k', T('contactTitle'), T('contactSub'), contactHtml)}`;
  $('#tr').innerHTML = await trainingsHtml(); $('#pr').innerHTML = await productsHtml(); $('#pa').innerHTML = await partnersHtml(); $('#hHome').innerHTML = await hirafiyinHtml();
}
async function pageTrainings() { app.innerHTML = sec('t', T('trainingsTitle'), T('trainingsSub'), '<div id="tr">...</div>') + sec('g', 'أنشطة الجمعية', 'لحظات من تكويناتنا ولقاءاتنا.', galleryHtml()); $('#tr').innerHTML = await trainingsHtml(); }
async function pagePartners() { app.innerHTML = sec('p', T('partnersTitle'), T('partnersSub'), '<div id="pa">...</div>'); $('#pa').innerHTML = await partnersHtml(); }
function pageJoin() { app.innerHTML = sec('j', T('joinReq'), 'تراجع الجمعية طلبك وتتصل بك عبر واتساب.', joinHtml); }
function pageContact() { app.innerHTML = sec('c', T('contactTitle'), T('contactSub'), contactHtml); }
const GAL = [['images/gallery/g1.jpeg','زيارة ميدانية لفضاء الأدوات الاحترافية'],['images/gallery/g2.jpeg','ورشة تقنية حول معدات الماء والتصفية'],['images/gallery/g3.jpeg','تكوين يطورك... وتضامن يحميك'],['images/gallery/g4.jpeg','لقاء مؤسساتي'],['images/gallery/g5.jpeg','اجتماع أعضاء الجمعية'],['images/gallery/g6.jpeg','تكوين تطبيقي في الإسعافات الأولية'],['images/gallery/g7.jpeg','توزيع الشواهد على المستفيدين من الدورة التكوينية'],['images/gallery/g8.jpeg','ورشة ميدانية بالسترات المميزة للجمعية'],['images/gallery/g9.jpeg','تكوين بشراكة مع شركات مهنية'],['images/gallery/g10.jpeg','عرض تطبيقي: الحفر بالمعدات الاحترافية'],['images/gallery/g11.jpeg','تكوين تطبيقي في صيانة المسابح'],['images/gallery/g12.jpeg','صورة جماعية بعد التكوين'],['images/gallery/g13.jpeg','لقاء أعضاء الجمعية']];
const VIDS = ['videos/v1.mp4','videos/v2.mp4','videos/v3.mp4'];
const galleryHtml = () => `<div class="gal">${GAL.map(([src, cap]) => `<figure><img src="${src}" alt="${esc(cap)}" loading="lazy" data-act="zoom" data-src="${src}"><figcaption>${esc(cap)}</figcaption></figure>`).join('')}${VIDS.map(v => `<figure><video src="${v}" controls preload="metadata" playsinline></video><figcaption>فيديو من أنشطة الجمعية</figcaption></figure>`).join('')}</div>`;
async function productsHtml() {
  const { data, error } = await sb.from('products').select('*').eq('status', 'accepted').order('created_at', { ascending: false });
  if (error || !data.length) return `<p class="empty">لم تُنشر منتجات بعد. الموردون المعتمدون يمكنهم نشر منتجاتهم هنا.</p>`;
  return `<div class="grid">${data.map(p => `<article class="card">${p.image_url ? `<img src="${esc(safeUrl(p.image_url))}" alt="" loading="lazy">` : ''}<div class="b"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.company)}${p.price ? ' · ' + esc(p.price) : ''}</div><p>${esc(p.description)}</p><div class="pc"><a class="btn sm ok" target="_blank" rel="noopener" href="${waLink(p.phone, 'السلام عليكم، أريد الاستفسار عن المنتج: ' + p.name)}">واتساب</a><a class="btn sm alt" href="tel:${esc(String(p.phone).replace(/\s/g, ''))}">اتصال</a></div></div></article>`).join('')}</div>`;
}
async function pageProducts() { app.innerHTML = sec('m', T('productsTitle'), T('productsSub'), '<div id="pr">...</div><p style="margin-top:18px"><a class="btn alt" href="#/sell">'+T('sellBtn')+'</a></p>'); $('#pr').innerHTML = await productsHtml(); }
function pageSell() { app.innerHTML = sec('s', 'انشر منتجك', 'تراجع الجمعية كل منتج وتؤكد لك النشر عبر واتساب.', `<div class="panel"><form id="sellForm">${HONEY}<label>اسم الشركة<input name="company" required></label><label>رقم الهاتف (واتساب)<input name="phone" type="tel" required pattern="(\\+?212|0)[5-7][0-9]{8}" title="مثال: 0600000000"></label><label>اسم المنتج<input name="name" required></label><label>الثمن (اختياري)<input name="price" placeholder="مثال: 120 درهم"></label><label>وصف<textarea name="description" rows="3"></textarea></label><label>صورة المنتج<input name="image" type="file" accept="image/*"></label><button class="btn">أرسل المنتج للمراجعة</button></form></div>`); }
const doneHtml = msg => `<h3>وصل طلبك</h3><p>أرسل لنا رسالة واتساب ليصلنا طلبك بسرعة. ستتصل بك الجمعية.</p><a class="btn ok" target="_blank" rel="noopener" href="${waLink(CFG.phone, msg)}">أرسل عبر واتساب للجمعية</a>`;
let tab = 'registrations';
async function pageAdmin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { app.innerHTML = sec('a', 'دخول الإدارة', '', `<div class="panel"><form id="loginForm"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="btn">دخول</button></form></div>`); return; }
  const tabs = [['registrations', 'تسجيلات التكوينات'], ['members', 'طلبات الانخراط'], ['trainings', 'التكوينات'], ['products', 'المنتجات'], ['partners', 'الشركاء']];
  app.innerHTML = sec('a', 'لوحة الإدارة', '', `<div class="tabs">${tabs.map(([k, l]) => `<button data-act="tab" data-k="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}<button data-act="logout">خروج</button></div><div id="adm">...</div>`);
  $('#adm').innerHTML = await ({ registrations: admRegs, members: admMembers, trainings: admTrainings, partners: admPartners, products: admProducts })[tab]();
}
const statusTag = s => `<span class="tag ${esc(s)}">${{ pending: 'في الانتظار', accepted: 'مقبول', refused: 'مرفوض' }[s] || esc(s)}</span>`;
const reqRow = (table, r, line, msgOk) => `<div class="row"><div><b>${esc(r.name)}</b> ${statusTag(r.status)}<div class="meta">${esc(r.phone)} · ${esc(r.city)} · ${line}</div></div><div class="acts"><button class="btn sm ok" data-act="ok" data-t="${table}" data-id="${esc(r.id)}" data-p="${esc(r.phone)}" data-m="${esc(msgOk)}">قبول + واتساب</button><button class="btn sm no" data-act="no" data-t="${table}" data-id="${esc(r.id)}">رفض</button><button class="btn sm alt" data-act="del" data-t="${table}" data-id="${esc(r.id)}">حذف</button></div></div>`;
async function admRegs() { const { data } = await sb.from('registrations').select('*, trainings(title,date,place)').order('created_at', { ascending: false }); if (!data?.length) return '<p class="empty">لا توجد تسجيلات بعد.</p>'; return data.map(r => reqRow('registrations', r, esc(r.trainings?.title || ''), `السلام عليكم ${r.name}، تم قبول تسجيلك في تكوين "${r.trainings?.title}" بتاريخ ${r.trainings?.date} في ${r.trainings?.place}. جمعية رصاصي سوس ماسة.`)).join(''); }
async function admMembers() { const { data } = await sb.from('members').select('*').order('created_at', { ascending: false }); if (!data?.length) return '<p class="empty">لا توجد طلبات بعد.</p>'; return data.map(r => reqRow('members', r, (r.kind === 'artisan' ? 'حرفي' : 'مورد') + ' · ' + esc(r.craft), `السلام عليكم ${r.name}، تم قبول انخراطك في جمعية رصاصي جهة سوس ماسة. مرحبا بك!`)).join(''); }
const addForm = (kind, fields) => `<div class="panel" style="margin-bottom:18px"><form data-add="${kind}">${fields}<button class="btn">إضافة</button></form></div>`;
async function admTrainings() { const { data } = await sb.from('trainings').select('*').order('date', { ascending: false }); return addForm('trainings', `<label>العنوان<input name="title" required></label><label>الوصف<textarea name="description" rows="3"></textarea></label><label>التاريخ<input name="date" type="date" required></label><label>المكان<input name="place" required></label><label>عدد المقاعد<input name="seats" type="number" min="0"></label><label>صورة<input name="image" type="file" accept="image/*"></label>`) + (data || []).map(t => `<div class="row"><div><b>${esc(t.title)}</b><div class="meta">${esc(t.date)} · ${esc(t.place)}</div></div><button class="btn sm no" data-act="del" data-t="trainings" data-id="${esc(t.id)}">حذف</button></div>`).join(''); }
async function admPartners() { const { data } = await sb.from('partners').select('*').order('created_at'); return addForm('partners', `<label>اسم الشركة<input name="name" required></label><label>رابط الموقع<input name="link" type="url" placeholder="https://"></label><label>الشعار<input name="image" type="file" accept="image/*"></label>`) + (data || []).map(p => `<div class="row"><b>${esc(p.name)}</b><button class="btn sm no" data-act="del" data-t="partners" data-id="${esc(p.id)}">حذف</button></div>`).join(''); }
async function admProducts() { const { data } = await sb.from('products').select('*').order('created_at', { ascending: false }); if (!data?.length) return '<p class="empty">لا توجد منتجات بعد.</p>'; return data.map(p => `<div class="row"><div><b>${esc(p.name)}</b> ${statusTag(p.status)}<div class="meta">${esc(p.company)} · ${esc(p.phone)}${p.price ? ' · ' + esc(p.price) : ''}</div></div><div class="acts"><button class="btn sm ok" data-act="ok" data-t="products" data-id="${esc(p.id)}" data-p="${esc(p.phone)}" data-m="${esc('السلام عليكم، تم نشر منتجك "' + p.name + '" في موقع الجمعية.')}">نشر + واتساب</button><button class="btn sm no" data-act="no" data-t="products" data-id="${esc(p.id)}">رفض</button><button class="btn sm alt" data-act="del" data-t="products" data-id="${esc(p.id)}">حذف</button></div></div>`).join(''); }
async function upload(file, bucket = 'images') { if (!file || !file.size) return null; const path = Date.now() + '-' + file.name.replace(/[^\w.]/g, ''); const { error } = await sb.storage.from(bucket).upload(path, file); if (error) throw error; return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl; }
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault(); const d = Object.fromEntries(new FormData(f)); if (d.website) return; delete d.website;
  try {
    if (f.id === 'joinForm') { const { error } = await sb.from('members').insert(d); if (error) throw error; f.closest('.panel').innerHTML = doneHtml(`السلام عليكم، أنا ${d.name} (${d.kind === 'artisan' ? 'حرفي' : 'مورد'}) من ${d.city}، تخصصي ${d.craft}. هاتفي ${d.phone}. أرغب في الانخراط في الجمعية.`); }
    else if (f.id === 'sellForm') { const url = await upload(d.image, 'products'); delete d.image; if (url) d.image_url = url; const { error } = await sb.from('products').insert(d); if (error) throw error; f.closest('.panel').innerHTML = doneHtml(`السلام عليكم، أنا من شركة ${d.company}. أرسلت المنتج "${d.name}" لنشره في الموقع. هاتفي ${d.phone}.`); }
    else if (f.id === 'regForm') { const title = f.dataset.title; const { error } = await sb.from('registrations').insert(d); if (error) throw error; $('#dlg').innerHTML = doneHtml(`السلام عليكم، أنا ${d.name} من ${d.city}. سجلت في تكوين "${title}". هاتفي ${d.phone}.`); }
    else if (f.id === 'loginForm') { const { error } = await sb.auth.signInWithPassword(d); if (error) throw error; route(); }
    else if (f.dataset.add) { const url = await upload(d.image); delete d.image; if (url) d.image_url = url; if (f.dataset.add === 'partners' && url) { d.logo_url = url; delete d.image_url; } if (d.seats === '') delete d.seats; const { error } = await sb.from(f.dataset.add).insert(d); if (error) throw error; toast('تمت الإضافة'); route(); }
  } catch (err) { const m = String(err.message || ''); toast(/too many/i.test(m) ? 'محاولات كثيرة، أعد المحاولة لاحقا' : /duplicate|unique/i.test(m) ? 'هذا الرقم مسجل من قبل' : 'خطأ: ' + (m || 'حاول مرة أخرى')); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const { act, t, id } = b.dataset;
  if (act === 'zoom') { $('#dlg').className = 'big'; $('#dlg').innerHTML = `<img src="${esc(b.dataset.src)}" alt="" style="width:100%;border-radius:6px">`; $('#dlg').showModal(); }
  else if (act === 'reg') { $('#dlg').className = ''; $('#dlg').innerHTML = `<h2>${esc(b.dataset.title)}</h2><form id="regForm" data-title="${esc(b.dataset.title)}"><input type="hidden" name="training_id" value="${esc(id)}">${personFields}<button class="btn">أكّد التسجيل</button></form>`; $('#dlg').showModal(); }
  else if (act === 'tab') { tab = b.dataset.k; route(); }
  else if (act === 'logout') { await sb.auth.signOut(); route(); }
  else if (act === 'ok' || act === 'no') { if (act === 'ok') window.open(waLink(b.dataset.p, b.dataset.m), '_blank'); const { error } = await sb.from(t).update({ status: act === 'ok' ? 'accepted' : 'refused' }).eq('id', id); toast(error ? 'خطأ: ' + error.message : 'تم التحديث'); route(); }
  else if (act === 'del' && confirm('حذف نهائي؟')) { const { error } = await sb.from(t).delete().eq('id', id); toast(error ? 'خطأ: ' + error.message : 'تم الحذف'); route(); }
});
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
function route() { const h = (location.hash || '#/').slice(2); ({ '': pageHome, hirafiyin: pageHirafiyin, trainings: pageTrainings, partners: pagePartners, products: pageProducts, sell: pageSell, join: pageJoin, contact: pageContact, admin: pageAdmin }[h] || pageHome)(); window.scrollTo(0, 0); }
addEventListener('hashchange', route); applyLang();
</script>
</body>
