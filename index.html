async function trainingsHtml(){const today=new Date().toISOString().slice(0,10);const{data,error}=await sb.from('trainings').select('*').gte('date',today).order('date');if(error||!data.length)return`<p class="empty">${T('noTr')}</p>`;return`<div class="grid">${data.map(t=>`<article class="card">${t.image_url?`<img src="${esc(safeUrl(t.image_url))}" alt="" loading="lazy">`:''}<div class="b"><h3>${esc(t.title)}</h3><div class="meta">${esc(t.date)} · ${esc(t.place)}${t.seats?' · '+esc(t.seats)+' '+T('seats'):''}</div><p>${esc(t.description)}</p><button class="btn" style="margin-top:auto;align-self:flex-start" data-act="reg" data-id="${esc(t.id)}" data-title="${esc(t.title)}">${T('reg')}</button></div></article>`).join('')}</div>`}
async function partnersHtml(){const{data,error}=await sb.from('partners').select('*').order('created_at');if(error||!data.length)return`<p class="empty">${T('noPa')}</p>`;return`<div class="partners chips">${data.map(p=>`<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${p.logo_url?`<img src="${esc(safeUrl(p.logo_url))}" alt="" style="height:36px;max-width:90px;object-fit:contain">`:''}${esc(p.name)}</a>`).join('')}</div>`}
async function productsHtml(){const{data,error}=await sb.from('products').select('*').eq('status','accepted').order('created_at',{ascending:false});if(error||!data.length)return`<p class="empty">${T('noPr')}</p>`;return`<div class="grid">${data.map(p=>`<article class="card">${p.image_url?`<img src="${esc(safeUrl(p.image_url))}" alt="" loading="lazy">`:''}<div class="b"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.company)}${p.price?' · '+esc(p.price):''}</div><p>${esc(p.description)}</p>${cbtn(p.phone,'السلام عليكم، أريد الاستفسار عن المنتج: '+p.name)}</div></article>`).join('')}</div>`}
let MEM=[],PRD=[];
async function loadDir(){const[m,p]=await Promise.all([sb.from('members').select('*').eq('status','accepted').eq('consent',true).order('created_at',{ascending:false}),sb.from('products').select('*').eq('status','accepted')]);MEM=m.data||[];PRD=p.data||[]}
function memCards(f,lim){let l=MEM.filter(m=>(!f.kind||m.kind===f.kind)&&(!f.craft||m.craft===f.craft));if(lim)l=l.slice(0,lim);if(!l.length)return`<p class="empty">${T('noMem')}</p>`;
return`<div class="grid">${l.map(m=>{const its=m.kind==='supplier'?PRD.filter(x=>last9(x.phone)===last9(m.phone)):[];return`<article class="card k"><div class="b"><span class="tag accepted">${m.kind==='artisan'?T('art'):T('sup')}</span><h3>${esc(m.name)}</h3><div class="meta">${esc(m.craft||'')} · ${esc(m.city||'')}</div>${its.length?`<ul style="margin:4px 0;padding-inline-start:18px">${its.map(x=>`<li><b>${esc(x.name)}</b>${x.price?' — '+esc(x.price):''}</li>`).join('')}</ul>`:''}${cbtn(m.phone,'السلام عليكم، وجدت اسمك في دليل جمعية رصاصي جهة سوس ماسة.')}</div></article>`}).join('')}</div>`}
async function pageHome(){
app.innerHTML=`<div class="hero"><div class="wrap"><div><p class="an">HIRAFIYIN • SOUSS MASSA • 2026</p><h1>${T('heroT')}</h1><p>${T('heroS')}</p><a class="btn" href="#/join">${T('joinA')}</a> <a class="btn alt" href="#/join">${T('joinS')}</a> <a class="btn alt" href="#/hirafiyin">${T('seeH')}</a><div class="stats">${STATS.map((n,i)=>`<div class="stat"><b>${n}</b><span>${T('st'+(i+1))}</span></div>`).join('')}</div></div><img class="hl" src="logo.jpeg.jpg" alt="HIRAFIYIN" onerror="this.remove()"></div></div>
${sec('sante','شراكة تعاونية في خدمة الصحة','Un Partenariat au Service de la Santé — Centre Radiologie Touderte • Aït Melloul',`<div class="health"><img src="p1.jpeg.JPG" alt="" loading="lazy" onerror="this.src='logo.jpeg.jpg'"><div class="b"><span class="badge">Partenariat • شراكة</span><h3 style="margin:0 0 8px">الفحوصات الطبية لأعضاء الجمعية</h3><p style="color:var(--mut)">يستفيد أعضاء HIRAFIYIN من فحوصات طبية بشراكة مع مركز الأشعة تودرت - أيت ملول:</p><ul style="margin:10px 0;line-height:2"><li><b>IRM</b> - الرنين المغناطيسي</li><li><b>Radiologie</b> - الأشعة السينية</li><li><b>Échographie</b> - الفحص بالصدى</li><li><b>Mammographie</b> - فحص الثدي</li></ul><a class="btn" href="#/join">${T('joinReq')}</a></div></div>`)}
${sec('c',T('craftsT'),'',`<div class="chips">${CRAFTS.map(c=>`<span>${c}</span>`).join('')}</div>`)}
${sec('w',T('whyT'),'',cards2(T('why')))}
${sec('hh',T('hirT'),T('hirS'),`<div id="hHome">...</div><p style="margin-top:18px"><a class="btn alt" href="#/hirafiyin" style="color:var(--ink)">${T('seeAll')}</a></p>`)}
${sec('t',T('trT'),T('trS'),`<div id="tr">...</div><p style="margin-top:18px"><a class="btn alt" href="#/trainings" style="color:var(--ink)">${T('seeG')}</a></p>`)}
${sec('h',T('howT'),'',cards2(T('how').map(([h,p],i)=>[(i+1)+'. '+h,p]))+`<p style="margin-top:18px"><a class="btn" href="#/join">${T('joinReq')}</a></p>`)}
${sec('m',T('prT'),T('prS'),`<div id="pr">...</div><p style="margin-top:18px"><a class="btn alt" href="#/sell" style="color:var(--ink)">${T('sell')}</a></p>`)}
${sec('p',T('paT'),T('paS'),'<div id="pa">...</div>')}
${sec('k',T('ctT'),T('ctS'),contactHtml())}`;
$('#tr').innerHTML=await trainingsHtml();$('#pr').innerHTML=await productsHtml();$('#pa').innerHTML=await partnersHtml();await loadDir();$('#hHome').innerHTML=memCards({},6)}
async function pageHir(){app.innerHTML=sec('hr',T('hirT'),T('hirS'),`<div class="fl"><select id="fk"><option value="">${T('all')}</option><option value="artisan">${T('artisans')}</option><option value="supplier">${T('suppliers')}</option></select><select id="fc"><option value="">${T('all')}</option>${craftOpts}</select></div><div id="hl">...</div><p style="margin-top:18px"><a class="btn" href="#/join">${T('joinReq')}</a></p>`);await loadDir();const up=()=>{$('#hl').innerHTML=memCards({kind:$('#fk').value,craft:$('#fc').value})};up();$('#fk').onchange=$('#fc').onchange=up}
async function pageTrainings(){app.innerHTML=sec('t',T('trT'),T('trS'),'<div id="tr">...</div>')+sec('g',T('galT'),T('galS'),galleryHtml());$('#tr').innerHTML=await trainingsHtml()}
async function pagePartners(){app.innerHTML=sec('p',T('paT'),T('paS'),'<div id="pa">...</div>');$('#pa').innerHTML=await partnersHtml()}
async function pageProducts(){app.innerHTML=sec('m',T('prT'),T('prS'),`<div id="pr">...</div><p style="margin-top:18px"><a class="btn alt" href="#/sell" style="color:var(--ink)">${T('sell')}</a></p>`);$('#pr').innerHTML=await productsHtml()}
const pageJoin=()=>{app.innerHTML=sec('j',T('joinReq'),T('joinS2'),`<div class="panel"><form id="joinForm"><label>${T('kind')}<select name="kind"><option value="artisan">${T('art')}</option><option value="supplier">${T('sup')}</option></select></label>${personFields()}<label>${T('craft')}<select name="craft">${craftOpts}</select></label><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" name="consent" required style="width:auto;margin-top:7px">${T('consent')}</label><button class="btn">${T('send')}</button></form></div>`)};
const pageSell=()=>{app.innerHTML=sec('s',T('sell'),'',`<div class="panel"><form id="sellForm">${HONEY}<label>اسم الشركة / Entreprise<input name="company" required></label>${phoneIn()}<label>اسم المنتج / Produit<input name="name" required></label><label>الثمن / Prix<input name="price" placeholder="120 DH"></label><label>وصف / Description<textarea name="description" rows="3"></textarea></label><label>صورة / Photo<input name="image" type="file" accept="image/*"></label><button class="btn">${T('send')}</button></form></div>`)};
const pageContact=()=>{app.innerHTML=sec('c',T('ctT'),T('ctS'),contactHtml())};
let tab='registrations';
async function pageAdmin(){const{data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML=sec('a','دخول الإدارة','',`<div class="panel"><form id="loginForm"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="btn">دخول</button></form></div>`);return}
const tabs=[['registrations','تسجيلات التكوينات'],['members','طلبات الانخراط'],['trainings','التكوينات'],['products','المنتجات'],['partners','الشركاء']];
app.innerHTML=sec('a','لوحة الإدارة','',`<div class="tabs">${tabs.map(([k,l])=>`<button data-act="tab" data-k="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}<button data-act="logout">خروج</button></div><div id="adm">...</div>`);
$('#adm').innerHTML=await({registrations:admRegs,members:admMembers,trainings:admTrainings,partners:admPartners,products:admProducts})[tab]()}
const stTag=s=>`<span class="tag ${esc(s)}">${{pending:'في الانتظار',accepted:'مقبول',refused:'مرفوض'}[s]||esc(s)}</span>`;
const reqRow=(t,r,line,m)=>`<div class="row"><div><b>${esc(r.name)}</b> ${stTag(r.status)}<div class="meta">${esc(r.phone)} · ${esc(r.city)} · ${line}</div></div><div class="acts"><button class="btn sm ok" data-act="ok" data-t="${t}" data-id="${esc(r.id)}" data-p="${esc(r.phone)}" data-m="${esc(m)}">قبول + واتساب</button><button class="btn sm no" data-act="no" data-t="${t}" data-id="${esc(r.id)}">رفض</button><button class="btn sm alt" data-act="del" data-t="${t}" data-id="${esc(r.id)}">حذف</button></div></div>`;
async function admRegs(){const{data}=await sb.from('registrations').select('*, trainings(title,date,place)').order('created_at',{ascending:false});if(!data?.length)return'<p class="empty">لا توجد تسجيلات بعد.</p>';return data.map(r=>reqRow('registrations',r,esc(r.trainings?.title||''),`السلام عليكم ${r.name}، تم قبول تسجيلك في تكوين "${r.trainings?.title}" بتاريخ ${r.trainings?.date} في ${r.trainings?.place}. جمعية رصاصي سوس ماسة.`)).join('')}
async function admMembers(){const{data}=await sb.from('members').select('*').order('created_at',{ascending:false});if(!data?.length)return'<p class="empty">لا توجد طلبات بعد.</p>';return `<button class="btn no" style="margin-bottom:12px" data-act="del-refused">مسح المرفوضين كاملين</button>`+data.map(r=>reqRow('members',r,(r.kind==='artisan'?'حرفي':'مورد')+' · '+esc(r.craft)+(r.consent?' · موافق على الظهور':' · بدون موافقة (لن يظهر في الدليل)'),`السلام عليكم ${r.name}، تم قبول انخراطك في جمعية رصاصي جهة سوس ماسة. مرحبا بك!`)).join('')}
const addForm=(k,f)=>`<div class="panel" style="margin-bottom:18px"><form data-add="${k}">${f}<button class="btn">إضافة</button></form></div>`;
async function admTrainings(){const{data}=await sb.from('trainings').select('*').order('date',{ascending:false});return addForm('trainings',`<label>العنوان<input name="title" required></label><label>الوصف<textarea name="description" rows="3"></textarea></label><label>التاريخ<input name="date" type="date" required></label><label>المكان<input name="place" required></label><label>عدد المقاعد<input name="seats" type="number" min="0"></label><label>صورة<input name="image" type="file" accept="image/*"></label>`)+(data||[]).map(t=>`<div class="row"><div><b>${esc(t.title)}</b><div class="meta">${esc(t.date)} · ${esc(t.place)}</div></div><button class="btn sm no" data-act="del" data-t="trainings" data-id="${esc(t.id)}">حذف</button></div>`).join('')}
async function admPartners(){const{data}=await sb.from('partners').select('*').order('created_at');return addForm('partners',`<label>اسم الشركة<input name="name" required></label><label>رابط الموقع<input name="link" type="url" placeholder="https://"></label><label>الشعار<input name="image" type="file" accept="image/*"></label>`)+(data||[]).map(p=>`<div class="row"><b>${esc(p.name)}</b><button class="btn sm no" data-act="del" data-t="partners" data-id="${esc(p.id)}">حذف</button></div>`).join('')}
async function admProducts(){const{data}=await sb.from('products').select('*').order('created_at',{ascending:false});if(!data?.length)return'<p class="empty">لا توجد منتجات بعد.</p>';return data.map(p=>`<div class="row"><div><b>${esc(p.name)}</b> ${stTag(p.status)}<div class="meta">${esc(p.company)} · ${esc(p.phone)}${p.price?' · '+esc(p.price):''}</div></div><div class="acts"><button class="btn sm ok" data-act="ok" data-t="products" data-id="${esc(p.id)}" data-p="${esc(p.phone)}" data-m="${esc('السلام عليكم، تم نشر منتجك "'+p.name+'" في موقع الجمعية.')}">نشر + واتساب</button><button class="btn sm no" data-act="no" data-t="products" data-id="${esc(p.id)}">رفض</button><button class="btn sm alt" data-act="del" data-t="products" data-id="${esc(p.id)}">حذف</button></div></div>`).join('')}
async function upload(f,b='images'){if(!f||!f.size)return null;const p=Date.now()+'-'+f.name.replace(/[^\w.]/g,'');const{error}=await sb.storage.from(b).upload(p,f);if(error)throw error;return sb.storage.from(b).getPublicUrl(p).data.publicUrl}
document.addEventListener('submit',async e=>{const f=e.target;e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.website)return;delete d.website;
try{if(f.id==='joinForm'){d.consent=true;const{error}=await sb.from('members').insert(d);if(error)throw error;f.closest('.panel').innerHTML=doneHtml(`السلام عليكم، أنا ${d.name} (${d.kind==='artisan'?'حرفي':'مورد'}) من ${d.city}، تخصصي ${d.craft}. هاتفي ${d.phone}. أرغب في الانخراط في الجمعية.`)}
else if(f.id==='sellForm'){const u=await upload(d.image,'products');delete d.image;if(u)d.image_url=u;const{error}=await sb.from('products').insert(d);if(error)throw error;f.closest('.panel').innerHTML=doneHtml(`السلام عليكم، أنا من شركة ${d.company}. أرسلت المنتج "${d.name}" لنشره في الموقع. هاتفي ${d.phone}.`)}
else if(f.id==='regForm'){const t=f.dataset.title;const{error}=await sb.from('registrations').insert(d);if(error)throw error;dlg.innerHTML=doneHtml(`السلام عليكم، أنا ${d.name} من ${d.city}. سجلت في تكوين "${t}". هاتفي ${d.phone}.`)}
else if(f.id==='loginForm'){const{error}=await sb.auth.signInWithPassword(d);if(error)throw error;route()}
else if(f.dataset.add){const u=await upload(d.image);delete d.image;if(u)d.image_url=u;if(f.dataset.add==='partners'&&u){d.logo_url=u;delete d.image_url}if(d.seats==='')delete d.seats;const{error}=await sb.from(f.dataset.add).insert(d);if(error)throw error;toast('تمت الإضافة');route()}}
catch(err){const m=String(err.message||'');toast(/too many/i.test(m)?'محاولات كثيرة، أعد المحاولة لاحقا':/duplicate|unique/i.test(m)?'هذا الرقم مسجل من قبل':'خطأ: '+(m||'حاول مرة أخرى'))}});
document.addEventListener('click',async e=>{
const lb=e.target.closest('[data-lang]');if(lb){LANG=lb.dataset.lang;try{localStorage.setItem('hirafiyin_lang',LANG)}catch(x){}applyLang();return}
if(e.target.closest('#mb')){$('#nv').classList.toggle('open');return}
if(e.target.closest('nav a'))$('#nv').classList.remove('open');
const b=e.target.closest('[data-act]');if(!b)return;const{act,t,id}=b.dataset;
if(act==='zoom')zoom(+b.dataset.i);else if(act==='nx')zoom(GI+ +b.dataset.d);
else if(act==='reg'){dlg.className='';dlg.innerHTML=`<h2>${esc(b.dataset.title)}</h2><form id="regForm" data-title="${esc(b.dataset.title)}"><input type="hidden" name="training_id" value="${esc(id)}">${personFields()}<button class="btn">${T('regOk')}</button></form>`;dlg.showModal()}
else if(act==='tab'){tab=b.dataset.k;route()}else if(act==='logout'){await sb.auth.signOut();route()}
else if(act==='del-refused'&&confirm('مسح جميع الطلبات المرفوضة؟')){const{error}=await sb.from('members').delete().eq('status','refused');toast(error?'خطأ: '+error.message:'تم مسح المرفوضين');route()}
else if(act==='ok'||act==='no'){if(act==='ok')window.open(waLink(b.dataset.p,b.dataset.m),'_blank');const{error}=await sb.from(t).update({status:act==='ok'?'accepted':'refused'}).eq('id',id);toast(error?'خطأ: '+error.message:'تم التحديث');route()}
else if(act==='del'&&confirm('حذف نهائي؟')){const{error}=await sb.from(t).delete().eq('id',id);toast(error?'خطأ: '+error.message:'تم الحذف');route()}});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
function route(){const h=(location.hash||'#/').slice(2);({'':pageHome,hirafiyin:pageHir,trainings:pageTrainings,partners:pagePartners,products:pageProducts,sell:pageSell,join:pageJoin,contact:pageContact,admin:pageAdmin}[h]||pageHome)();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+h||(h===''&&a.getAttribute('href')==='#/')));window.scrollTo(0,0)}
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T(el.dataset.i18n)});route()}
addEventListener('hashchange',route);applyLang();
</script>
</body>
