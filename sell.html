<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نشر منتج - HIRAFIYIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>body{margin:0;font-family:Tahoma,sans-serif;background:#f4f7fa;color:#13263b}header{background:#0a2540;color:#fff;padding:14px;text-align:center;font-weight:800} .box{max-width:520px;margin:20px auto;background:#fff;padding:20px;border-radius:12px} label{display:block;margin:12px 0 4px;font-weight:700} input,select,textarea{width:100%;padding:12px;border:1px solid #d9e1e9;border-radius:8px;font-size:16px;box-sizing:border-box} .btn{display:block;width:100%;margin-top:18px;background:#b87333;color:#fff;border:0;padding:14px;border-radius:8px;font-size:18px;font-weight:800} a{color:#0a2540} .note{background:#fff7e6;border:1px solid #f0c58f;padding:10px;border-radius:8px;font-size:14px;margin-top:12px}</style>
</head>
<body>
<header>HIRAFIYIN • نشر منتج للموردين</header>
<div class="box">
<h2 style="margin:0">أنا مورد: أريد نشر منتج</h2>
<p style="color:#5b6b7c">تراجع الجمعية منتجك وتنشره في الموقع بعد القبول.</p>
<form onsubmit="sendWA(event)">
<label>اسم الشركة / Entreprise</label>
<input id="company" required placeholder="مثال: شركة النور">
<label>رقم الهاتف (واتساب)</label>
<input id="phone" type="tel" required placeholder="06XXXXXXXX">
<label>اسم المنتج / Produit</label>
<input id="name" required placeholder="مثال: أنبوب نحاس">
<label>الثمن / Prix</label>
<input id="price" placeholder="120 DH">
<label>وصف / Description</label>
<textarea id="desc" rows="3" placeholder="الجودة، المقاس، التوصيل..."></textarea>
<label>المدينة</label>
<input id="city" required placeholder="أكادير">
<button class="btn" id="btnSend">أرسل المنتج</button>
<p id="msg" style="text-align:center;color:#1f7a4d;font-weight:700"></p>
</form>
<div class="note">📸 من بعد ما تسيفط - سيفط لينا تصويرة المنتج ف نفس الواتساب - باش ننشروه مع المنتج.</div>
<p style="text-align:center"><a href="https://hirafiyin-soussema.vercel.app">← الرجوع للموقع</a></p>
</div>
<script>
var sb=null;
try{ sb=supabase.createClient('https://oldwrxirxrshwvyqvpxp.supabase.co','sb_publishable_Uv5HMjCc7ZgI4S7BlyjaFQ__ACuR_DX'); }catch(e){ sb=null; }
async function sendWA(e){
 e.preventDefault();
 var btn=document.getElementById('btnSend'); btn.textContent='... جاري الإرسال'; btn.disabled=true;
 var company=document.getElementById('company').value;
 var phone=document.getElementById('phone').value;
 var name=document.getElementById('name').value;
 var price=document.getElementById('price').value;
 var desc=document.getElementById('desc').value;
 var city=document.getElementById('city').value;
 if(sb){
   try{ await sb.from('products').insert({company:company, phone:phone, name:name, price:price, description:desc}); }catch(err){ console.log(err); }
 }
 var msg = "السلام عليكم، أنا من شركة " + company + " من " + city + ". أرسلت المنتج \"" + name + "\" لنشره في الموقع. الثمن: " + price + ". الوصف: " + desc + ". هاتفي " + phone + ".";
 document.getElementById('msg').textContent='تم تسجيل المنتج! غادي نحولك لواتساب...';
 setTimeout(function(){ window.location.href = "https://wa.me/212600213299?text=" + encodeURIComponent(msg); },800);
}
</script>
</body>
</html>
