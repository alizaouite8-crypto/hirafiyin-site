<!DOCTYPE html>

<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>body{margin:0;font-family:Tahoma,sans-serif;background:#f4f7fa;color:#13263b}header{background:#0a2540;color:#fff;padding:14px;text-align:center;font-weight:800} .box{max-width:520px;margin:20px auto;background:#fff;padding:20px;border-radius:12px} label{display:block;margin:12px 0 4px;font-weight:700} input,select,textarea{width:100%;padding:12px;border:1px solid #d9e1e9;border-radius:8px;font-size:16px;box-sizing:border-box} .btn{display:block;width:100%;margin-top:18px;background:#b87333;color:#fff;border:0;padding:14px;border-radius:8px;font-size:18px;font-weight:800} a{color:#0a2540}</style>

<body>
<header>HIRAFIYIN • أضف منتجك</header>

<form onsubmit="sendSell(event)">
<label>اسم المورد / الشركة</label>

<label>رقم الهاتف (واتساب)</label>

<input id="city" required placeholder="أكادير">
<label>اسم المنتج</label>
<input id="product" required placeholder="مثال: أنابيب نحاس">
<label>السعر (درهم)</label>
<input id="price" type="number" required placeholder="مثال: 150">
<label>الوصف</label>
<textarea id="desc" rows="3" placeholder="وصف مختصر للمنتج..."></textarea>
<button class="btn" id="btnSell">أرسل المنتج</button>
</form>
<p style="text-align:center"><a href="https://alizaouite8-crypto.github.io">← الرجوع للموقع</a></p>
</div>
<script>
var sb=null;
try{ sb=supabase.createClient('https://oldwrxirxrshwvyqvpxp.supabase.co','sb_publishable_Uv5HMjCc7ZgI4S7BlyjaFQ__ACuR_DX'); }catch(e){ sb=null; }
function sendSell(e){
 e.preventDefault();
 var btn=document.getElementById('btnSell');
 // 1 - NICHAN - L-BOUTON NIT KAY-WELLI KHEDER - MA-KAY-TSENNACH SUPABASE

 // 2 - Sjel f Supabase f l-khalfiya

 }

 setTimeout(function(){ window.location.href = "https://wa.me/212600213299?text=" + encodeURIComponent(msg); },1200);
}
</script>
